<!DOCTYPE html>
<html>
<head>
    <title>Assignment Lab Task 03</title>
</head>
<body>
   <form>
    <table border="1" width="700px" cellspacing="0" cellpadding="15" align="center">
        <tr>
            <th colspan="2" align="center">
                <h3>Person Profile</h3>
            </th>
        </tr>

        <tr>
            <td> Name </td>
            <td><input type="text" name="" value="" id="name"/> </td>

        </tr>

        <tr>
            <td> Email </td>
            <td><input type="email" name="" value="" id="myEmail" /> </td>

        </tr>
        
        <tr>
            <td> Gender </td>
            <td>
                    <input type="radio" name="gender" id="male" value="Male"> Male
                    <input type="radio" name="gender" id="female" value="Female"> Female
                    <input type="radio" name="gender" id="other" value="Other"> Other
                </td>

        </tr>

        <tr>
            <td> Date Of Birth </td>
            <td><input type="date" name="" value="" id="dob"/> </td>
        </tr>

        <tr>
            <td> Blood Group </td>
            <td>
                    <select name="blood_group" id="blood">

                        <option value="">Select Blood Group</option>
                        <option value="A+">A+</option>
                        <option value="B+">B+</option>
                        <option value="AB+">AB+</option>
                        <option value="O+">O+</option>
                    </select>
                </td>
        </tr>

        <tr>
            <td> Degree </td>
            <td>
                <input type="checkbox" name="abc[]" value="" /> SSC
                    <input type="checkbox" name="abc[]" value="" /> HSC
                    <input type="checkbox" name="abc[]" value="" /> BSC
                    <input type="checkbox" name="abc[]" value="" /> MSC

                 </td>
        </tr>

        <tr>
            <td> Photo </td>
            <td> <input type="file" name="profile_pic" id="pic"/>  </td> 
            </tr>

            <tr>
                <td colspan="2">
                 <br>
                </td>
            </tr>

             <tr>
                <td colspan="2" align="right">
                   <input type="submit" name="" value="Submit" onclick=" return validation()"/>
                   <input type="reset" name="" value="Reset"/>
                </td>
            </tr>
    </table>
</form>
    <script src="08_personProfileScript.js"></script>
</body>
</html>
